sentence=Virtual screen and control panel for ESP32, controlled from the FlightESP iOS app.
paragraph=Add control buttons (up/down/left/right/OK/back), toggles (RGB strip, scan signal, buzzer...) and a virtual screen - text or real pixels via sendFrame() (Flipper Zero / spacedesk style). Everything you print() or sendFrame() is shown live on your phone by the FlightESP app. Transport: Serial, Bluetooth LE, or Wi-Fi (AP or station) with per-device name, password and screen resolution.
